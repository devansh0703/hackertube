name: Build and release app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*'

jobs:
  build:
    name: Build, sign and release app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        uses: ilharp/sign-android-release@v2
        id: sign
        with:
          signingKey: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      # Create release notes from the latest fastlane metadata changelog
      - name: Create changelog summary
        id: changelog-summary
        run: |
            summary_file=$(find fastlane/metadata/android/en-US/changelogs -type f | sort -V | tail -n 1)
            {
              echo 'summary<<EOF'
              echo '> [!NOTE]'
              echo '> ## Release Highlights'
              sed 's/^/> /' "$summary_file"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"

      - name: Rename apk file
        run: mv "${{ steps.sign.outputs.signedFile }}" "app-release.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: HackerTube ${{ github.ref_name }}
          body: ${{ steps.changelog-summary.outputs.summary }}
          files: "app-release.apk"
          fail_on_unmatched_files: true
          make_latest: true
